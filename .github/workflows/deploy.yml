# Builds the deploy artifact and tells Coolify to pull it. Gated on CI.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# The minimum for GITHUB_TOKEN to push to ghcr.io. `attestations`/`id-token` would only be
# needed for a build-provenance attestation, which this does not produce.
permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  gate:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` is what Coolify pulls; the `sha-` tag is the rollback handle.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # POST, not GET: since Coolify 4.2.0 the GET route returns 405 "This endpoint has
      # changed to a POST request." (their published docs still show the GET example).
      #
      # No `force` param: it only affects Coolify's own build paths. A Docker Image resource
      # runs `docker compose pull` unconditionally, so `latest` is genuinely re-resolved.
      #
      # A 200 means the deployment was queued, not that it is live — hence --fail-with-body,
      # which at least surfaces auth and configuration errors instead of passing silently.
      - name: Trigger Coolify redeploy
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"uuid\":\"$COOLIFY_APP_UUID\"}" \
            "$COOLIFY_URL/api/v1/deploy"
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
