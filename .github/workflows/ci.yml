# The gate. Every check here was previously a manual pre-commit ritual in the README.
name: CI

on:
  pull_request:
  # Called by deploy.yml so main is never shipped unchecked. Deliberately not triggered by
  # `push` to main as well: that would start a second, independent run of this same workflow
  # alongside the one deploy.yml calls, and the two would land in the same concurrency group
  # and cancel each other.
  workflow_call:

permissions:
  contents: read

# Scoped by workflow as well as ref. When deploy.yml calls this, `github.workflow` is the
# caller's name, so a gate run can never share a group with anything else.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Runs `prepare` -> `svelte-kit sync`, which both svelte-check and the type-aware
      # eslint config depend on.
      - run: pnpm install --frozen-lockfile

      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test:unit
      - run: pnpm build
