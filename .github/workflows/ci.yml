# The gate. Every check here was previously a manual pre-commit ritual in the README.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Called by deploy.yml so main is never shipped unchecked.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Runs `prepare` -> `svelte-kit sync`, which both svelte-check and the type-aware
      # eslint config depend on.
      - run: pnpm install --frozen-lockfile

      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test:unit
      - run: pnpm build
