name: Cleanup Container Images

# Prunes old per-commit (SHA-tagged) images from GHCR. deploy.yml tags every push with both a
# moving tag (`latest`) and a frozen `sha-<short>` tag; without pruning the SHA tags accumulate
# forever, which makes the package page unreadable and the rollback list meaningless.
#
# Note this is hygiene, not quota: GHCR storage and bandwidth are free for public packages, and
# this package is public. Keep the schedule anyway — the useful bound is "the last few builds I
# might roll back to", not "as many as GitHub will hold".
#
# Multi-arch aware: each tag is an OCI image index whose arch and attestation child manifests are
# stored as separate untagged versions. This action deletes an index together with its children,
# so it never orphans layers.

on:
  schedule:
    - cron: "0 4 * * 0" # weekly, Sunday 04:00 UTC
  workflow_dispatch:
    inputs:
      dry-run:
        description: "List what would be deleted without deleting"
        type: boolean
        default: true

jobs:
  cleanup:
    name: Prune old images
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete old container versions
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # The live deployment tag. Coolify pulls `latest`, and the newest `sha-` tag points at
          # the same version, so excluding this also protects whatever is currently serving.
          exclude-tags: latest
          # Keep the most recent SHA-tagged builds for rollback; prune the rest.
          keep-n-tagged: 5
          # Remove any genuinely orphaned (untagged, unreferenced) versions.
          delete-untagged: true
          # Verify no kept image is left with dangling child manifests.
          validate: true
          # Honour the dry-run toggle on manual runs; scheduled runs delete.
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
